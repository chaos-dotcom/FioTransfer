[workspace]
members = ["egui-ui"]
resolver = "2"

[package]
name = "fiotransfer"
version = "1.3.0"
edition = "2021"
build = "build.rs"
description = "Fast uploads to and downloads from Frame.io (Rust port of FioTransfer)"

[lib]
name = "fiotransfer"
path = "src/lib.rs"

[[bin]]
name = "FioTransfer"
path = "src/main.rs"

[[bin]]
name = "fio"
path = "src/bin/fio.rs"

[[bin]]
name = "fio-bench"
path = "src/bin/bench.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = true, features = ["json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
url = "2.5.8"
percent-encoding = "2.3.2"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.6"
security-framework = "3.7.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
wry = "0.57.1"
tao = "0.37.2"
libc = "0.2"
async-trait = "0.1.92"
once_cell = "1"
x509-parser = "0.18.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
bytes = "1.12.1"

[build-dependencies]
cc = "1.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

# Unsigned packaging through cargo-packager (0.11 reads this table; `--config`
# with a file path is broken in that release, so the config lives here).
#   cargo packager --formats app        (macOS app bundle; also: dmg)
[package.metadata.packager]
product-name = "FioTransfer"
# version is taken from [package] above, so a bump there is the bump here.
identifier = "com.farbhaus.fiotransfer"
out-dir = "dist"
binaries-dir = "target/release"
formats = ["app"]
icons = ["build/icons/icon.icns", "build/icons/icon_1024.png", "build/icons/icon_512.png"]
before-packaging-command = "cargo build --release -p fiotransfer --bin FioTransfer"
resources = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]

[[package.metadata.packager.binaries]]
path = "FioTransfer"
main = true

[package.metadata.packager.macos]
minimum-system-version = "13.0"
